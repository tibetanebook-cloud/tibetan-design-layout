name: Tibetan Design Layout builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare Tibetan font
        shell: pwsh
        run: |
          ./scripts/prepare-tibetan-font.ps1
          "CRAFT_FONTS_DIR=$env:CRAFT_FONTS_DIR" >> $env:GITHUB_ENV
          "CRAFT_FONTS_REQUIRED=1" >> $env:GITHUB_ENV
      - name: Validate customized source and templates
        shell: pwsh
        run: |
          cargo test -p designcraft-compose --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p designcraft-engine --lib templates:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p designcraft --bin designcraft updates:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p designcraft-ui-egui --lib i18n:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p designcraft-ui-egui --lib tibetan_tests --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p designcraft-ui-egui --lib language_menu_is_next_to_help_and_switches_tibetan --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check customized Rust code
        shell: pwsh
        run: |
          cargo clippy -p designcraft-engine -p designcraft-ui-egui -p designcraft --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask layers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Render Pecha previews
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/previews | Out-Null
          foreach ($preset in @('pechaClassic', 'pechaCompact', 'pechaBilingual')) {
            & './target/windows-package/x64/designcraft-cli.exe' run --cmd "template.${preset}={}" --all-pages "dist/previews/$preset" --export "dist/previews/$preset.designcraft" --export "dist/previews/$preset.pdf"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Design-Layout-Windows-x64
          if-no-files-found: error
          path: |
            dist/release/tibetan-design-layout-*-windows-x64.msi
            dist/release/tibetan-design-layout-*-windows-x64-portable.zip
            dist/previews/**
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Tibetan font
        run: |
          source scripts/prepare-tibetan-font.sh
          echo "CRAFT_FONTS_DIR=$CRAFT_FONTS_DIR" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Validate customized source and templates
        run: |
          cargo test -p designcraft-compose --lib --locked
          cargo test -p designcraft-engine --lib templates:: --locked
          cargo test -p designcraft --bin designcraft updates:: --locked
          cargo test -p designcraft-ui-egui --lib i18n:: --locked
          cargo test -p designcraft-ui-egui --lib tibetan_tests --locked
          cargo test -p designcraft-ui-egui --lib language_menu_is_next_to_help_and_switches_tibetan --locked
      - name: Build and verify Mac DMG
        run: bash packaging/macos/package.sh --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Design-Layout-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/release/tibetan-design-layout-*-macos-${{ matrix.arch }}.dmg
            dist/release/tibetan-design-layout-cli-*-macos-${{ matrix.arch }}.zip


  publish:
    name: Publish Layout 0.9.1
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Tibetan-Design-Layout-*
          path: artifacts
      - name: Verify and publish all platform installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for name in tibetan-design-layout-0.9.1-windows-x64.msi tibetan-design-layout-0.9.1-windows-x64-portable.zip tibetan-design-layout-0.9.1-macos-aarch64.dmg tibetan-design-layout-0.9.1-macos-x86_64.dmg; do
            mapfile -t matches < <(find artifacts -type f -name "$name")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp "${matches[0]}" "release-assets/$name"
          done
          (cd release-assets && sha256sum -- *.msi *.zip *.dmg > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          # Tibetan Design Layout — བོད་ཀྱི་ཤོག་ངོས་བཟོ་བཀོད།

          Created by ནང་ཆེན་བཀྲ་ཤིས།

          - Updated from upstream 0.9 with font, layout and text-threading fixes; Tibetan branding retained.
          - 180 additional Tibetan tool, template and page-layout labels.
          - Tibetan syllable wrapping at tsheg and linked front/back Pecha body frames.
          - Original endless-knot application icon on Windows and Mac.
          - Visible English / བོད་ཡིག language menu beside Help.
          - 16 editable Pecha and book templates, including framed title/body leaves and bilingual layouts.
          - Daily update notifications, manual Help check, opt-out and Skip this version.

          Choose windows-x64.msi for Windows installation, or the portable ZIP. For Mac, choose aarch64 for Apple Silicon (M-series), or x86_64 for Intel. These builds are not publisher-signed/notarized. Pecha folio labels remain editable manual text; automatic imposition is not included.

          Existing installations need this version installed once to receive future update notifications. Updates open the release page; installers are not downloaded or executed automatically.

          More apps: https://nangchen.com · https://studytibetan.com · https://tibetanebook.com
          NOTES
          printf '\nSource commit: %s\n' "$SOURCE_SHA" >> notes.md
          if gh release view v0.9.1 --json isDraft >/dev/null 2>&1; then
            test "$(gh release view v0.9.1 --json isDraft --jq .isDraft)" = true
            test "$(gh release view v0.9.1 --json targetCommitish --jq .targetCommitish)" = "$SOURCE_SHA"
          else
            gh release create v0.9.1 --target "$SOURCE_SHA" --title 'Tibetan Design Layout 0.9.1' --notes-file notes.md --draft
          fi
          gh release upload v0.9.1 release-assets/* --clobber
          test "$(gh release view v0.9.1 --json assets --jq '.assets | length')" = 5
          gh release edit v0.9.1 --notes-file notes.md --draft=false --latest
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = v0.9.1
          echo "Published https://github.com/$GH_REPO/releases/tag/v0.9.1" >> "$GITHUB_STEP_SUMMARY"
